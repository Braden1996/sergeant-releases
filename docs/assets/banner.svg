<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Sergeant</title>
  <desc id="desc">The Sergeant wordmark beside a file graph: one file is edited, the three files that reach it run again, and every other file is reused from the cache.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141d3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5b544" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f5b544" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <!-- Insignia: three chevrons whose corners are nodes of a graph -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
    <polyline points="72,150 122,112 172,150" stroke="#f5b544"/>
    <polyline points="72,196 122,158 172,196" stroke="#3dd6c4"/>
    <polyline points="72,242 122,204 172,242" stroke="#3dd6c4" stroke-opacity="0.55"/>
  </g>
  <g fill="#0b1020" stroke-width="5">
    <circle cx="72" cy="150" r="8" stroke="#f5b544"/><circle cx="122" cy="112" r="8" stroke="#f5b544"/><circle cx="172" cy="150" r="8" stroke="#f5b544"/>
    <circle cx="72" cy="196" r="8" stroke="#3dd6c4"/><circle cx="122" cy="158" r="8" stroke="#3dd6c4"/><circle cx="172" cy="196" r="8" stroke="#3dd6c4"/>
    <circle cx="72" cy="242" r="8" stroke="#3dd6c4" stroke-opacity="0.55"/><circle cx="122" cy="204" r="8" stroke="#3dd6c4" stroke-opacity="0.55"/><circle cx="172" cy="242" r="8" stroke="#3dd6c4" stroke-opacity="0.55"/>
  </g>

  <!-- Wordmark -->
  <text x="212" y="200" fill="#f4f6fb" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">sergeant</text>
  <text x="216" y="252" fill="#aab4d4" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500">The build system that knows every file.</text>
  <text x="216" y="306" fill="#6f7aa0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18">edit one file  →  rerun only what it reaches</text>

  <g transform="translate(24,0)">
  <!-- File graph -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <!-- reused edges -->
    <g stroke="#3a4566">
      <path d="M800 110 C 875 110, 875 80, 950 80"/>
      <path d="M800 290 C 875 290, 875 260, 950 260"/>
      <path d="M800 290 C 875 290, 875 340, 950 340"/>
      <path d="M950 80 C 1025 80, 1025 240, 1100 240"/>
      <path d="M950 260 C 1025 260, 1025 240, 1100 240"/>
      <path d="M950 340 C 1025 340, 1025 330, 1100 330"/>
      <path d="M1100 240 C 1160 240, 1160 190, 1210 190"/>
      <path d="M1100 130 C 1160 130, 1160 190, 1210 190"/>
    </g>
    <!-- edges on the way from the edit to what reaches it -->
    <g stroke="#3dd6c4" stroke-width="3.5">
      <path d="M800 110 C 875 110, 875 170, 950 170"/>
      <path d="M800 200 C 875 200, 875 170, 950 170"/>
      <path d="M950 170 C 1025 170, 1025 130, 1100 130"/>
    </g>
  </g>

  <circle cx="1100" cy="130" r="40" fill="url(#glow)"/>

  <g stroke-width="3">
    <!-- reused -->
    <g fill="#1a2343" stroke="#3a4566">
      <circle cx="950" cy="80" r="12"/>
      <circle cx="800" cy="290" r="12"/>
      <circle cx="950" cy="260" r="12"/>
      <circle cx="950" cy="340" r="12"/>
      <circle cx="1100" cy="240" r="12"/>
      <circle cx="1100" cy="330" r="12"/>
      <circle cx="1210" cy="190" r="12"/>
    </g>
    <!-- reruns -->
    <g fill="#10302f" stroke="#3dd6c4">
      <circle cx="800" cy="110" r="14"/>
      <circle cx="800" cy="200" r="14"/>
      <circle cx="950" cy="170" r="14"/>
    </g>
    <!-- edited -->
    <circle cx="1100" cy="130" r="16" fill="#3a2a0c" stroke="#f5b544" stroke-width="4"/>
  </g>

  <g font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="782" y="85" fill="#9feee4" text-anchor="end">main.ts</text>
    <text x="782" y="205" fill="#9feee4" text-anchor="end">cart.test.ts</text>
    <text x="950" y="148" fill="#9feee4" text-anchor="middle">cart.ts</text>
    <text x="1100" y="98" fill="#f5b544" text-anchor="middle">price.ts</text>
  </g>

  <!-- Legend -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b95b8">
    <circle cx="768" cy="372" r="6" fill="#3a2a0c" stroke="#f5b544" stroke-width="2.5"/>
    <text x="782" y="377">edited</text>
    <circle cx="862" cy="372" r="6" fill="#10302f" stroke="#3dd6c4" stroke-width="2.5"/>
    <text x="876" y="377">runs again</text>
    <circle cx="986" cy="372" r="6" fill="#1a2343" stroke="#3a4566" stroke-width="2.5"/>
    <text x="1000" y="377">reused from the cache</text>
  </g>
  </g>
</svg>
