<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  #frame { padding: 0; }
  .card {
    width: 1280px; height: 400px; border-radius: 24px; overflow: hidden; position: relative;
    background:
      radial-gradient(600px 300px at 82% 40%, rgba(61, 214, 196, 0.10), transparent 70%),
      radial-gradient(500px 260px at 12% 110%, rgba(245, 181, 68, 0.10), transparent 70%),
      linear-gradient(135deg, #0b1020, #141d3a);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(90deg, rgba(0,0,0,0.5), #000 55%);
  }
  .left { position: absolute; left: 72px; top: 92px; }
  .mark { display: flex; align-items: center; gap: 26px; }
  .word { font-size: 104px; font-weight: 800; letter-spacing: -4px; color: #f4f6fb; line-height: 1; }
  .tag { margin-top: 26px; font-size: 30px; font-weight: 500; color: #b4bedd; letter-spacing: -0.3px; }
  .tag b { color: #f4f6fb; font-weight: 600; }
  .stat {
    margin-top: 30px; display: inline-flex; gap: 12px; align-items: center;
    font-family: var(--mono); font-size: 17px; color: #8b95b8;
    border: 1px solid #2a3557; background: rgba(11, 16, 32, 0.6); border-radius: 999px; padding: 9px 18px;
  }
  .stat .dot { width: 8px; height: 8px; border-radius: 50%; background: #3dd6c4; box-shadow: 0 0 12px #3dd6c4; }
  .stat em { color: #9feee4; font-style: normal; }
  svg.graph { position: absolute; right: 40px; top: 34px; }
  .graph text { font-family: var(--mono); font-size: 14px; }
</style>
<body data-variants="single">
<div id="frame">
  <div class="card">
    <div class="grid"></div>
    <div class="left">
      <div class="mark">
        <svg width="92" height="128" viewBox="0 0 92 128" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
          <polyline points="8,40 46,12 84,40" stroke="#f5b544"/>
          <polyline points="8,78 46,50 84,78" stroke="#3dd6c4"/>
          <polyline points="8,116 46,88 84,116" stroke="#3dd6c4" stroke-opacity="0.5"/>
        </svg>
        <div class="word">sergeant</div>
      </div>
      <div class="tag">The build system for code that <b>agents</b> write.</div>
      <div class="stat"><span class="dot"></span><span>sgt check after an edit: <em>296 ms</em> on 10,050 files</span></div>
    </div>
    <svg class="graph" width="520" height="340" viewBox="0 0 520 340"></svg>
  </div>
</div>
<script>
  // A file graph: one file edited, what reaches it runs again, the rest is reused.
  const nodes = {
    a1: [40, 50], a2: [40, 140], a3: [40, 230], a4: [40, 300],
    b1: [170, 30], b2: [170, 110], b3: [170, 190], b4: [170, 270],
    c1: [300, 70], c2: [300, 160], c3: [300, 250],
    d1: [430, 40], d2: [430, 130], d3: [430, 220], d4: [430, 300],
  };
  const edges = [
    ["a1", "b1"], ["a1", "b2"], ["a2", "b2"], ["a2", "b3"], ["a3", "b3"], ["a4", "b4"], ["a3", "b4"],
    ["b1", "c1"], ["b2", "c1"], ["b3", "c2"], ["b4", "c3"], ["b3", "c3"],
    ["c1", "d1"], ["c2", "d2"], ["c2", "d3"], ["c3", "d4"], ["c1", "d2"],
  ];
  const edited = "c2";
  const hot = new Set(["d2", "d3"]); // files that import the edited one, directly or not
  const hotEdges = new Set(["c2-d2", "c2-d3"]);
  const labels = { c2: ["price.ts", 0, -26, "#f5b544"], d2: ["cart.ts", 0, -24, "#9feee4"], d3: ["cart.test.ts", 0, 34, "#9feee4"] };
  const svg = document.querySelector("svg.graph");
  const ns = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
  el("circle", { cx: nodes[edited][0], cy: nodes[edited][1], r: 56, fill: "url(#glow)" });
  const defs = document.createElementNS(ns, "defs");
  defs.innerHTML = '<radialGradient id="glow"><stop offset="0" stop-color="#f5b544" stop-opacity="0.35"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></radialGradient>';
  svg.prepend(defs);
  for (const [f, t] of edges) {
    const [x1, y1] = nodes[f], [x2, y2] = nodes[t], m = (x1 + x2) / 2;
    const isHot = hotEdges.has(`${f}-${t}`);
    el("path", { d: `M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}`, fill: "none",
      stroke: isHot ? "#3dd6c4" : "#2f3a5c", "stroke-width": isHot ? 3.5 : 2.5, "stroke-linecap": "round" });
  }
  for (const [id, [x, y]] of Object.entries(nodes)) {
    if (id === edited) el("circle", { cx: x, cy: y, r: 15, fill: "#3a2a0c", stroke: "#f5b544", "stroke-width": 4 });
    else if (hot.has(id)) el("circle", { cx: x, cy: y, r: 13, fill: "#10302f", stroke: "#3dd6c4", "stroke-width": 3.5 });
    else el("circle", { cx: x, cy: y, r: 10, fill: "#161f3b", stroke: "#34405f", "stroke-width": 2.5 });
  }
  for (const [id, [text, dx, dy, color]] of Object.entries(labels)) {
    const t = el("text", { x: nodes[id][0] + dx, y: nodes[id][1] + dy, fill: color, "text-anchor": "middle" });
    t.textContent = text;
  }
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
